<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Carnival — Memory Machine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{
  --bg:#09080e; --screen:#0b1010; --orange:#ff762b; --gold:#ffd166;
  --green:#7bff9a; --purple:#c46cff; --red:#ff465e; --cyan:#4de8e0;
  --muted:#9ba49b; --line:#3c5b45;
}
*{box-sizing:border-box}
html{min-height:100%;background:#08070a}
body{margin:0;min-height:100vh;color:var(--gold);font-family:'VT323',monospace;font-size:22px;
 background:radial-gradient(ellipse at 50% 0%,#302035 0%,#111018 45%,#07070a 100%);
 display:flex;align-items:center;justify-content:center;padding:20px}
button,input{font:inherit}
button{cursor:pointer}
.crt-case{width:min(100%,1050px);padding:clamp(12px,2.5vw,26px);border-radius:32px;
 background:linear-gradient(145deg,#b9a88a,#6d6253 15%,#332f2d 24%,#171719 75%,#726653);
 box-shadow:0 20px 60px #000b,inset 0 3px 4px #fff4,inset 0 -5px 8px #000b;position:relative}
.crt-case:before{content:"";position:absolute;inset:8px;border-radius:26px;border:2px solid #d8c7a044;pointer-events:none}
.monitor{position:relative;overflow:hidden;border-radius:28px / 22px;border:10px solid #101012;
 background:var(--screen);min-height:650px;box-shadow:inset 0 0 35px #000,0 0 0 2px #544b40}
.monitor:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;
 background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,#0008 4px),
 linear-gradient(110deg,#fff0 0%,#fff0 65%,#ffffff08 80%,#fff0 100%);
 opacity:.45}
.glass-glow{position:absolute;inset:0;pointer-events:none;z-index:19;box-shadow:inset 0 0 40px #ff6a1610,inset 0 0 4px #fff2}
.screen-content{position:relative;z-index:2;padding:clamp(18px,4vw,42px);min-height:650px}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #34443b;padding-bottom:13px;margin-bottom:24px;color:var(--green);font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.8}
.brandbar .lights{display:flex;gap:7px}.light{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px currentColor}.light:nth-child(2){background:var(--green)}.light:nth-child(3){background:var(--purple)}
h1,h2,h3,p{margin-top:0}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4vw,39px);line-height:1.55;color:var(--orange);text-shadow:3px 3px #792a26,0 0 18px #ff762b55;margin-bottom:18px}
h2{font-family:'Press Start 2P',monospace;font-size:clamp(13px,2vw,19px);line-height:1.7;color:var(--gold);margin-bottom:20px}
h3{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.8;color:var(--green)}
p{line-height:1.35;color:#e5d9b5}
.subtitle{color:var(--muted);font-size:25px}
.pixel-art{font-size:clamp(38px,7vw,72px);line-height:1.3;filter:drop-shadow(0 0 12px #ff762b55);letter-spacing:8px;margin:8px 0 22px}
.menu-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.panel{border:1px solid var(--line);background:#0b1110d9;padding:20px;box-shadow:inset 0 0 0 3px #111a17,0 0 20px #0005}
.btn{display:block;width:100%;border:1px solid var(--orange);color:var(--gold);background:#15100f;padding:13px 15px;margin:10px 0;text-align:left;
 text-transform:uppercase;letter-spacing:1px;box-shadow:inset 0 0 0 2px #2c1714;transition:transform .12s,background .12s,color .12s}
.btn:before{content:"▶ ";color:var(--orange);opacity:0}.btn:hover,.btn:focus-visible{background:#321a15;transform:translateX(3px);outline:1px solid var(--gold)}.btn:hover:before,.btn:focus-visible:before{opacity:1}
.btn.primary{background:#2b1710;border-color:var(--gold);color:#fff0b3}.btn.secondary{border-color:#5c7161;color:var(--green)}
.btn.small{display:inline-block;width:auto;min-width:130px;text-align:center}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{border:1px solid var(--line);padding:16px 10px;background:#101411;color:var(--gold);text-align:center;line-height:1.6}
.mode strong{display:block;font-family:'Press Start 2P',monospace;font-size:10px;margin:10px 0}
.mode span{font-size:18px;color:var(--muted)}
.mode.selected{border-color:var(--orange);box-shadow:0 0 15px #ff762b33;background:#21130f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid #34483b;padding:12px 8px;text-align:center;background:#0c1310}
.stat label{display:block;font-size:17px;color:var(--muted);margin-bottom:6px}
.stat strong{font-family:'Press Start 2P',monospace;font-size:clamp(11px,2vw,16px);color:var(--gold)}
.playfield{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:clamp(8px,2vw,16px);max-width:620px;margin:24px auto}
.pad{aspect-ratio:1;border:3px solid #34483b;border-radius:10px;background:#111715;box-shadow:inset 0 0 0 4px #080a09,0 5px 0 #030404;transition:filter .12s,transform .12s;position:relative;overflow:hidden}
.pad:after{content:"";position:absolute;inset:18%;border:1px solid #ffffff22;border-radius:5px}
.pad[data-color="0"]{--pad:#ff465e}.pad[data-color="1"]{--pad:#ff9b38}.pad[data-color="2"]{--pad:#ffd166}.pad[data-color="3"]{--pad:#7bff9a}.pad[data-color="4"]{--pad:#4de8e0}
.pad.lit{background:var(--pad);border-color:#fff6;filter:brightness(1.45);box-shadow:0 0 26px var(--pad),inset 0 0 20px #fff8;transform:scale(1.04)}
.pad:disabled{cursor:default;opacity:.8}
.notice{min-height:36px;text-align:center;color:var(--green);font-size:27px;margin:10px 0}
.hidden{display:none!important}
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
input{min-width:0;flex:1;background:#080b09;border:1px solid #59705d;color:var(--gold);padding:12px;outline:none}
input:focus{border-color:var(--gold)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:10px 0 20px}
th,td{padding:11px 8px;border-bottom:1px solid #26392e;text-align:left}
th{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--orange);line-height:1.8}
td{font-size:23px;color:#e9dfc3}
tr.current td{color:var(--green);background:#112016}
.help-list{padding-left:25px;line-height:1.65;color:#e5d9b5}
.help-list li{padding-left:5px;margin:5px 0}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid #2d3b32;color:#718174;font-size:18px}
.blink{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
.case-label{text-align:center;font:9px 'Press Start 2P',monospace;letter-spacing:3px;color:#e2d2b4;margin-top:14px;text-shadow:1px 1px #111}
.case-controls{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:10px 18px 0}
.knob{width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,#b6a88e,#39332b 70%);border:2px solid #29251f;box-shadow:0 2px 4px #0009}
.power{width:12px;height:8px;background:#8bff62;box-shadow:0 0 9px #8bff62;border-radius:3px}
@media(max-width:680px){body{padding:8px}.crt-case{padding:10px;border-radius:20px}.monitor{border-width:6px;min-height:0;border-radius:18px}.screen-content{padding:18px 14px;min-height:620px}.menu-layout{grid-template-columns:1fr;gap:14px}.menu-art{text-align:center}.menu-art .pixel-art{margin:0}.mode-grid{grid-template-columns:1fr}.mode{display:flex;align-items:center;gap:12px;text-align:left}.mode strong{margin:0}.mode span{margin-left:auto}.stats{grid-template-columns:repeat(2,1fr)}.playfield{grid-template-columns:repeat(5,minmax(35px,1fr));gap:7px}.brandbar{font-size:8px}.panel{padding:14px}}
</style>
</head>
<body>
<div class="crt-case">
  <div class="monitor"><div class="glass-glow"></div><main class="screen-content" id="app"></main></div>
  <div class="case-label">HAUNT-O-TRON 1986 // CARNIVAL EDITION</div>
  <div class="case-controls"><div class="knob"></div><div class="knob"></div><div class="knob"></div><div class="power"></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(() => {
  // Paste your Firebase web app config values below. These are public client config values,
  // NOT service-account credentials or private keys.
 const firebaseConfig = {
  apiKey: "AIzaSyAUTtanvcRgL47SIvoRtSufAlxjfEOuAFw",
  authDomain: "halloween-carnival-f9d6e.firebaseapp.com",
  projectId: "halloween-carnival-f9d6e",
  storageBucket: "halloween-carnival-f9d6e.firebasestorage.app",
  messagingSenderId: "860143167060",
  appId: "1:860143167060:web:df4c645b146b86e8952fc1"
};
  const LEADERBOARD_COLLECTION = 'leaderboard';
  let db = null;
  try {
    if (firebaseConfig.apiKey.startsWith('AIza') && !firebaseConfig.projectId.startsWith('PASTE_')) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }
  } catch (e) { console.error('Firebase initialization failed:', e); }

  const app = document.getElementById('app');
  const COLORS = ['#ff465e','#ff9b38','#ffd166','#7bff9a','#4de8e0'];
  const ICONS = ['🩸','🎃','🌙','👻','🦇'];
  const STORE_KEY = 'hauntotron_leaderboard_v1';
  let screen = 'home', mode = 'medium', sequence = [], inputIndex = 0;
  let score = 0, round = 1, best = Number(localStorage.getItem('hauntotron_best') || 0);
  let accepting = false, busy = false, soundOn = true, soundCtx = null;
  let playerName = '', lastScore = 0, lastRound = 1, roundTimer = null;

  const modes = {
    easy:   {label:'BOO BEGINNER', count:3, speed:720, rounds:12, points:10},
    medium: {label:'MIDWAY MAYHEM', count:4, speed:560, rounds:18, points:15},
    hard:   {label:'NIGHTMARE', count:5, speed:420, rounds:25, points:20}
  };
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function shell(content){
    app.innerHTML = `<div class="brandbar"><span>☠ HAUNT-O-TRON</span><span class="lights"><i class="light"></i><i class="light"></i><i class="light"></i></span><span>INSERT COURAGE</span></div>${content}<div class="footer"><span>© 1986 MIDNIGHT MIDWAY</span><span>MEMORY IS A SCARY THING <span class="blink">_</span></span></div>`;
  }
  function playTone(freq=440,duration=.12,type='square',volume=.04){
    if(!soundOn) return;
    try{
      soundCtx = soundCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc=soundCtx.createOscillator(), gain=soundCtx.createGain();
      osc.type=type;osc.frequency.value=freq;gain.gain.value=volume;
      osc.connect(gain);gain.connect(soundCtx.destination);
      gain.gain.setTargetAtTime(0.0001,soundCtx.currentTime+duration*.65,.025);
      osc.start();osc.stop(soundCtx.currentTime+duration);
    }catch(e){}
  }
  function toneFor(i){playTone([220,277,330,440,554][i]||440,.18,'square',.035);}
  function clickSound(){playTone(180,.04,'square',.018);}
  function home(){
    screen='home';
    shell(`<section class="menu-layout">
      <div class="menu-art"><div class="pixel-art">🎪 🌕 🎃</div><h1>HALLOWEEN<br>CARNIVAL</h1><h2>MEMORY MACHINE</h2><p class="subtitle">Step right up, if you dare...</p><p>Remember the lights. Repeat the pattern.<br>One wrong move and the carnival gets you.</p></div>
      <div class="panel"><h3>◆ MAIN ATTRACTIONS ◆</h3>
        <button class="btn primary" data-action="play">START GAME</button>
        <button class="btn" data-action="leaderboard">HIGH SCORE BOARD</button>
        <button class="btn" data-action="how">HOW TO PLAY</button>
        <button class="btn" data-action="settings">MACHINE SETTINGS</button>
        <div style="margin-top:20px;color:var(--muted);font-size:19px">PERSONAL BEST <strong style="color:var(--green)">${best}</strong></div>
      </div></section>`);
  }
  function chooseMode(){
    screen='mode';
    shell(`<h2>CHOOSE YOUR NIGHTMARE</h2><p>How brave are you feeling?</p>
      <div class="mode-grid">
        <button class="mode ${mode==='easy'?'selected':''}" data-mode="easy"><span>👻</span><strong>BOO BEGINNER</strong><span>3 lights</span></button>
        <button class="mode ${mode==='medium'?'selected':''}" data-mode="medium"><span>🎃</span><strong>MIDWAY MAYHEM</strong><span>4 lights</span></button>
        <button class="mode ${mode==='hard'?'selected':''}" data-mode="hard"><span>💀</span><strong>NIGHTMARE</strong><span>5 lights</span></button>
      </div><div class="panel" style="margin-top:20px"><p id="mode-desc">${modeDescription()}</p><button class="btn primary" data-action="begin">LET THE GAMES BEGIN!</button><button class="btn secondary" data-action="home">BACK TO LOBBY</button></div>`);
  }
  function modeDescription(){const m=modes[mode];return `${m.label}: ${m.count} glowing pads, ${m.rounds} possible rounds. Earn ${m.points} base points per round. The pattern grows every round.`;}
  function beginGame(){
    score=0;round=1;sequence=[];inputIndex=0;accepting=false;busy=false;playerName='';
    screen='game';sequence.push(randomPad());renderGame('WATCH CLOSELY...');setTimeout(playSequence,550);
  }
  function randomPad(){return Math.floor(Math.random()*modes[mode].count);}
  function renderGame(message=''){
    screen='game';
    const m=modes[mode];
    shell(`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">ROUND ${round}</h2><span style="color:var(--orange)">MODE: ${m.label}</span></div>
      <div class="stats"><div class="stat"><label>SCORE</label><strong>${score}</strong></div><div class="stat"><label>BEST</label><strong>${Math.max(best,score)}</strong></div><div class="stat"><label>SEQUENCE</label><strong>${sequence.length}</strong></div><div class="stat"><label>MAX ROUNDS</label><strong>${m.rounds}</strong></div></div>
      <div class="notice" id="notice">${message}</div>
      <div class="playfield">${Array.from({length:5},(_,i)=>`<button class="pad ${i>=m.count?'hidden':''}" data-pad="${i}" data-color="${i}" aria-label="Light ${i+1}" ${accepting?'':'disabled'}></button>`).join('')}</div>
      <div style="text-align:center;color:var(--muted)">WATCH THE LIGHTS. THEN REPEAT THE ORDER.</div>
      <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn small secondary" data-action="replay" ${busy?'disabled':''}>REPLAY PATTERN</button><button class="btn small" data-action="quit">QUIT RUN</button></div>`);
  }
  function flashPad(index,duration=240){
    return new Promise(resolve=>{
      const pad=app.querySelector(`[data-pad="${index}"]`);
      if(!pad){resolve();return}
      pad.classList.add('lit');toneFor(index);
      setTimeout(()=>{pad.classList.remove('lit');setTimeout(resolve,100)},duration);
    });
  }
  async function playSequence(){
    if(screen!=='game')return;
    busy=true;accepting=false;
    const notice=document.getElementById('notice');if(notice)notice.textContent='WATCH CLOSELY...';
    app.querySelectorAll('.pad').forEach(p=>p.disabled=true);
    await new Promise(r=>setTimeout(r,300));
    for(let i=0;i<sequence.length;i++){
      if(screen!=='game')return;
      await flashPad(sequence[i],Math.max(180,modes[mode].speed-180));
      await new Promise(r=>setTimeout(r,Math.max(100,modes[mode].speed-350)));
    }
    if(screen!=='game')return;
    busy=false;accepting=true;inputIndex=0;
    app.querySelectorAll('.pad:not(.hidden)').forEach(p=>p.disabled=false);
    const n=document.getElementById('notice');if(n)n.textContent='YOUR TURN — REPEAT IT!';
  }
  async function handlePad(i){
    if(!accepting||busy||screen!=='game')return;
    flashPad(i,130);
    if(i!==sequence[inputIndex]){
      accepting=false;busy=true;playTone(100,.5,'sawtooth',.05);
      setTimeout(gameOver,550);return;
    }
    inputIndex++;
    if(inputIndex===sequence.length){
      accepting=false;busy=true;
      score += modes[mode].points * round;
      if(score>best){best=score;localStorage.setItem('hauntotron_best',String(best))}
      const n=document.getElementById('notice');if(n)n.textContent='PERFECT! THE SPIRITS APPROVE!';
      playTone(660,.12);setTimeout(()=>playTone(880,.16),100);
      if(round>=modes[mode].rounds){setTimeout(victory,850);return}
      round++;sequence.push(randomPad());
      setTimeout(()=>{if(screen==='game'){renderGame('ROUND '+round+' — GET READY...');setTimeout(playSequence,450)}},850);
    }
  }
  function gameOver(){
    if(screen!=='game')return;
    lastScore=score;lastRound=round;screen='over';
    shell(`<div style="text-align:center"><div class="pixel-art">👻 💀 🎃</div><h1 style="color:var(--red)">GAME OVER</h1><h2>THE CARNIVAL CLAIMS ANOTHER</h2><div class="stats"><div class="stat"><label>FINAL SCORE</label><strong>${score}</strong></div><div class="stat"><label>ROUND REACHED</label><strong>${round}</strong></div><div class="stat"><label>PERSONAL BEST</label><strong>${best}</strong></div><div class="stat"><label>DIFFICULTY</label><strong>${mode.toUpperCase()}</strong></div></div>
      <p>Enter your name for the High Score Board.</p><form id="score-form" class="formrow"><input id="player-name" maxlength="16" placeholder="YOUR SPOOKIEST NAME" autocomplete="nickname" required><button class="btn small primary" type="submit">SAVE SCORE</button></form>
      <button class="btn" data-action="again">TRY AGAIN</button><button class="btn secondary" data-action="leaderboard">VIEW LEADERBOARD</button><button class="btn secondary" data-action="home">MAIN LOBBY</button></div>`);
    const input=document.getElementById('player-name');if(input)input.focus();
  }
  function victory(){
    screen='victory';lastScore=score;lastRound=round;
    shell(`<div style="text-align:center"><div class="pixel-art">🏆 🎃 🦇</div><h1>YOU SURVIVED!</h1><h2>MASTER OF THE MIDWAY</h2><p>You conquered every round. The carnival tips its hat to you!</p>
      <div class="stats"><div class="stat"><label>FINAL SCORE</label><strong>${score}</strong></div><div class="stat"><label>ROUNDS CLEARED</label><strong>${round}</strong></div><div class="stat"><label>PERSONAL BEST</label><strong>${best}</strong></div><div class="stat"><label>DIFFICULTY</label><strong>${mode.toUpperCase()}</strong></div></div>
      <p>Put your name in the carnival hall of fame.</p><form id="score-form" class="formrow"><input id="player-name" maxlength="16" placeholder="YOUR SPOOKIEST NAME" required><button class="btn small primary" type="submit">SAVE SCORE</button></form>
      <button class="btn" data-action="again">PLAY AGAIN</button><button class="btn secondary" data-action="leaderboard">LEADERBOARD</button><button class="btn secondary" data-action="home">MAIN LOBBY</button></div>`);
  }
  function readScores(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return []}}
  function cloudReady(){ return !!db; }
  async function saveScore(name){
    const entry={name:name.trim().slice(0,16)||'MYSTERY GUEST',score:Math.max(0,Math.floor(Number(lastScore)||0)),mode,round:Math.max(1,Math.floor(Number(lastRound)||1)),createdAt:firebase.firestore.FieldValue.serverTimestamp()};
    const local=readScores();
    local.push({...entry,createdAt:new Date().toISOString()});
    local.sort((a,b)=>b.score-a.score||b.round-a.round);
    localStorage.setItem(STORE_KEY,JSON.stringify(local.slice(0,10)));
    if(cloudReady()){
      try{
        await db.collection(LEADERBOARD_COLLECTION).add(entry);
        leaderboard('Score submitted to the shared leaderboard!');
      }catch(err){
        console.error(err);
        leaderboard('Online save failed. Check Firestore database rules and configuration.');
      }
    }else{
      leaderboard('Saved on this device. Paste your Firebase config to enable shared scores.');
    }
  }
  async function leaderboard(message=''){
    screen='leaderboard';
    const local=readScores();
    renderLeaderboard(local,message||(cloudReady()?'Loading shared scores…':'Local scores — Firebase not configured.'));
    if(cloudReady()){
      try{
        const snapshot=await db.collection(LEADERBOARD_COLLECTION).orderBy('score','desc').limit(10).get();
        const remote=snapshot.docs.map(doc=>doc.data());
        if(screen==='leaderboard')renderLeaderboard(remote,message||'LIVE SHARED LEADERBOARD');
      }catch(err){
        console.error(err);
        if(screen==='leaderboard')renderLeaderboard(local,'Online leaderboard unavailable. Check Firestore rules and database setup.');
      }
    }
  }
  function renderLeaderboard(list,message=''){
    const rows=list.length?list.map((r,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${esc(r.name)}</td><td>${Number(r.score)||0}</td><td>${esc(String(r.mode||'').toUpperCase())}</td><td>${Number(r.round)||0}</td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--muted)">NO SOULS ON THE BOARD YET. BE THE FIRST!</td></tr>`;
    shell(`<h2>🏆 HIGH SCORE BOARD</h2><p>Legends of the Midnight Midway.</p>
      <div class="notice" style="font-size:21px">${esc(message)}</div>
      <div class="table-wrap"><table><thead><tr><th>RANK</th><th>PLAYER</th><th>SCORE</th><th>MODE</th><th>ROUND</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p style="color:var(--muted);font-size:19px">${cloudReady()?'Shared online leaderboard — all visitors see the same scores.':'Configure Firebase to share the leaderboard across devices.'}</p>
      <button class="btn primary" data-action="play">PLAY FOR A PLACE</button><button class="btn secondary" data-action="refresh-leaderboard">REFRESH SCORES</button><button class="btn secondary" data-action="home">BACK TO LOBBY</button>
      <button class="btn" data-action="clear-scores">CLEAR LOCAL SCORES</button>`);
  }
  function howTo(){
    screen='how';
    shell(`<h2>HOW TO PLAY</h2><div class="panel"><ol class="help-list"><li>Watch the colored lights flash in order.</li><li>Repeat the exact sequence by clicking or tapping the pads.</li><li>Each successful round adds another light to the sequence.</li><li>One wrong tap ends the run — spooky, but fair.</li><li>Choose a harder mode for more lights and more rounds.</li><li>Enter your name after a run to submit your score to the leaderboard. Once online storage is configured, everyone sees the same scores.</li></ol><p style="color:var(--green)">TIP: Say the colors quietly in your head as they flash.</p></div><button class="btn primary" data-action="play">I'M READY</button><button class="btn secondary" data-action="home">BACK TO LOBBY</button>`);
  }
  function settings(){
    screen='settings';
    shell(`<h2>MACHINE SETTINGS</h2><div class="panel"><div class="formrow" style="align-items:center"><span style="min-width:150px">SOUND EFFECTS</span><button class="btn small ${soundOn?'primary':'secondary'}" data-action="sound">${soundOn?'ON':'OFF'}</button></div><p>Current difficulty: ${modes[mode].label}</p><div class="mode-grid">
      <button class="mode ${mode==='easy'?'selected':''}" data-mode="easy"><strong>EASY</strong><span>3 lights</span></button><button class="mode ${mode==='medium'?'selected':''}" data-mode="medium"><strong>MEDIUM</strong><span>4 lights</span></button><button class="mode ${mode==='hard'?'selected':''}" data-mode="hard"><strong>HARD</strong><span>5 lights</span></button></div>
      <p style="color:var(--muted);font-size:19px">Personal best is local. The leaderboard can be shared online after Firebase setup.</p></div><button class="btn secondary" data-action="home">SAVE & BACK</button>`);
  }
  app.addEventListener('click',e=>{
    const pad=e.target.closest('[data-pad]');
    if(pad){handlePad(Number(pad.dataset.pad));return}
    const modeButton=e.target.closest('[data-mode]');
    if(modeButton){mode=modeButton.dataset.mode;if(screen==='mode')chooseMode();else settings();clickSound();return}
    const button=e.target.closest('[data-action]');if(!button)return;
    clickSound();
    switch(button.dataset.action){
      case 'play':chooseMode();break;
      case 'begin':beginGame();break;
      case 'home':home();break;
      case 'leaderboard':leaderboard();break;
      case 'refresh-leaderboard':leaderboard();break;
      case 'how':howTo();break;
      case 'settings':settings();break;
      case 'again':beginGame();break;
      case 'quit':if(confirm('Leave this run? Your current score will not be saved.'))home();break;
      case 'replay':if(!busy&&screen==='game')playSequence();break;
      case 'sound':soundOn=!soundOn;settings();break;
      case 'clear-scores':if(confirm('Clear all leaderboard entries stored in this browser?')){localStorage.removeItem(STORE_KEY);leaderboard()}break;
    }
  });
  app.addEventListener('submit',e=>{
    if(e.target.id!=='score-form')return;e.preventDefault();
    const input=document.getElementById('player-name');if(!input||!input.value.trim())return;
    saveScore(input.value);
  });
  document.addEventListener('keydown',e=>{
    if(screen!=='game'||!accepting||busy)return;
    const key=Number(e.key);
    if(key>=1&&key<=modes[mode].count)handlePad(key-1);
  });
  home();
})();
</script>
</body>
</html>
